networks:
  medianet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rclone_media:
  cinesync_db:
  jellyfin_config:
  jellyseerr_config:
  seerrbridge_data:
  seerrbridge_mysql:
  seerrbridge_logs:

services:
  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    networks:
      - medianet

  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: zurg
    restart: unless-stopped
    volumes:
      - ./zurg.yaml:/app/config.yaml:ro
    environment:
      - RD_API_TOKEN=${RD_API_TOKEN}
    networks:
      - medianet

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    command: >
      mount zurg: /media
      --config /dev/null
      --vfs-cache-mode off
      --allow-other
      --allow-non-empty
      --dir-cache-time 10s
      --rc
      --rc-no-auth
      --rc-addr=:5572
    environment:
      - RCLONE_CONFIG_ZURG_TYPE=webdav
      - RCLONE_CONFIG_ZURG_URL=http://zurg:9999
      - RCLONE_CONFIG_ZURG_VENDOR=other
    volumes:
      - rclone_media:/media:rshared
    depends_on:
      - zurg
    networks:
      - medianet

  cinesync:
    image: sureshfizzy/cinesync:latest
    container_name: cinesync
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - rclone_media:/mnt/zurg:ro
      - rclone_media:/mnt/media:rshared
      - cinesync_db:/app/db
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - rclone
    networks:
      - medianet

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.huang67.com
    volumes:
      - jellyfin_config:/config
      - rclone_media:/mnt/zurg:ro
    depends_on:
      - rclone
    networks:
      - medianet

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      - TZ=UTC
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - jellyseerr_config:/app/config
    depends_on:
      - jellyfin
    networks:
      - medianet

  seerrbridge:
    image: ghcr.io/woahai321/seerrbridge:latest
    container_name: seerrbridge
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - NODE_ENV=production
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3777
      - DB_HOST=localhost
      - DB_PORT=3306
      - DB_NAME=seerrbridge
      - DB_USER=seerrbridge
      - DB_PASSWORD=seerrbridge
      - MYSQL_ROOT_PASSWORD=seerrbridge_root
      - USE_DATABASE=true
      - SEERRBRIDGE_URL=http://localhost:8777
      - SETUP_API_URL=http://localhost:8778
      - SEERRBRIDGE_SETUP_URL=http://localhost:8778
    ports:
      - "127.0.0.1:3777:3777"
      - "127.0.0.1:8777:8777"
      - "127.0.0.1:8778:8778"
    volumes:
      - seerrbridge_mysql:/var/lib/mysql
      - seerrbridge_logs:/app/logs
      - seerrbridge_data:/app/data
    depends_on:
      - jellyseerr
    networks:
      - medianet
