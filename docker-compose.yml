networks:
  medianet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rclone_media:

services:
  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    networks:
      - medianet

  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: zurg
    restart: unless-stopped
    volumes:
      - ./zurg.yaml:/app/config.yaml:ro
    environment:
      - RD_API_TOKEN=${RD_API_TOKEN}
    networks:
      - medianet

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    command: >
      mount zurg: /media
      --config /dev/null
      --vfs-cache-mode off
      --allow-other
      --allow-non-empty
      --dir-cache-time 10s
      --rc
      --rc-no-auth
      --rc-addr=:5572
    environment:
      - RCLONE_CONFIG_ZURG_TYPE=webdav
      - RCLONE_CONFIG_ZURG_URL=http://zurg:9999
      - RCLONE_CONFIG_ZURG_VENDOR=other
    volumes:
      - rclone_media:/media:rshared
    depends_on:
      - zurg
    networks:
      - medianet
