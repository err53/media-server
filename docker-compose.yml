networks:
  medianet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rclone_media:
  cinesync_db:
  jellyfin_config:

services:
  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    networks:
      - medianet

  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: zurg
    restart: unless-stopped
    volumes:
      - ./zurg.yaml:/app/config.yaml:ro
    environment:
      - RD_API_TOKEN=${RD_API_TOKEN}
    networks:
      - medianet

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    command: >
      mount zurg: /media
      --config /dev/null
      --vfs-cache-mode off
      --allow-other
      --allow-non-empty
      --dir-cache-time 10s
      --rc
      --rc-no-auth
      --rc-addr=:5572
    environment:
      - RCLONE_CONFIG_ZURG_TYPE=webdav
      - RCLONE_CONFIG_ZURG_URL=http://zurg:9999
      - RCLONE_CONFIG_ZURG_VENDOR=other
    volumes:
      - rclone_media:/media:rshared
    depends_on:
      - zurg
    networks:
      - medianet

  cinesync:
    image: sureshfizzy/cinesync:latest
    container_name: cinesync
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - rclone_media:/mnt/zurg:ro
      - rclone_media:/mnt/media:rshared
      - cinesync_db:/app/db
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - rclone
    networks:
      - medianet

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.huang67.com
    volumes:
      - jellyfin_config:/config
      - rclone_media:/mnt/zurg:ro
    depends_on:
      - rclone
    networks:
      - medianet
